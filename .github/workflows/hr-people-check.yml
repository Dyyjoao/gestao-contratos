name: SIG RH People and Culture Check
on:
  push:
    branches: [main, 'feature/**', 'chatgpt/**']
  pull_request:
    branches: [main]
jobs:
  rh-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RH indicators and access
        run: |
          set -e
          node --check js/hr-metrics.js
          node --check js/hr-people.js
          node --check js/hr-culture.js
          node --check js/hr-agenda.js
          node tests/hr-metrics.test.mjs
          grep -q 'hr-people.js' app.js
          grep -q 'hr-culture.js' app.js
          grep -q 'hr-agenda.js' app.js
          grep -q 'match /rhColaboradores/{id}' firestore.rules
          grep -q 'match /rhAvaliacoes360/{id}' firestore.rules
          grep -q 'match /rhAcoes/{id}' firestore.rules
          grep -q 'rhAusencias' js/profiles.js
          grep -q 'participanteUsuarios' js/hr-agenda.js
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/rh-server.log 2>&1 &
          sleep 2
      - name: Open RH pages in headless Chrome
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          cp index.html rh-smoke.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('rh-smoke.html');s=p.read_text().replace('<script type="module" src="app.js?v=13"></script>','')
          script='''<script type="module">(async()=>{try{const core=await import('./js/core.js');await import('./js/hr-people.js');await import('./js/hr-culture.js');await import('./js/my-desk.js');await import('./js/hr-agenda.js');core.state.usuario={id:'smoke',grupoId:'g',empresaId:'e'};core.state.perfil={acessoTotal:true,ativo:true,permissoes:{}};window.dispatchEvent(new Event('sig:ready'));await new Promise(r=>setTimeout(r,300));for(const id of ['pagina-rh','pagina-rh-avaliacoes','pagina-rh-acoes','rhInicio','rhFim','rhPorSetorBox','rhCultLista-avaliacoes','rhCultLista-acoes','mesaAcoesRh'])if(!document.getElementById(id))throw Error('RH ausente: '+id);const btn=document.querySelector('[data-rh-tab="ausencias"]');btn.click();if(!btn.classList.contains('ativo'))throw Error('Aba de absenteísmo indisponível');document.documentElement.setAttribute('data-rh-smoke','ok')}catch(e){document.documentElement.setAttribute('data-rh-smoke','fail');document.body.insertAdjacentHTML('beforeend','<pre id="rh-smoke-error">'+String(e.stack||e)+'</pre>')}})()</script>'''
          p.write_text(s.replace('</body>',script+'</body>'))
          PY
          timeout 35s "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/rh-smoke.html > /tmp/rh-smoke-dom.html
          grep -q 'data-rh-smoke="ok"' /tmp/rh-smoke-dom.html || { grep -o '<pre id="rh-smoke-error">[^<]*' /tmp/rh-smoke-dom.html || true; exit 1; }
