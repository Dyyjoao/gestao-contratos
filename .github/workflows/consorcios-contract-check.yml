name: SIG Consorcios Contract Check

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
      - 'hotfix/**'
  pull_request:
    branches: [main]

jobs:
  consorcios-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Consorcios v1 contract
        run: |
          set -e

          node --check js/consortium-calculations.js
          node --check js/ctrl-consorcios-v1.js
          node --check js/profiles.js
          node --check js/controllership-router.js

          # Consórcios continua lazy-loaded, mas agora é item de primeiro nível.
          grep -q 'ctrl-consorcios-v1.js' js/controllership-router.js
          grep -q 'case"consorcios"' js/controllership-router.js
          grep -q 'consorciosVisualizar' js/controllership-router.js
          grep -q 'consorciosEditar' js/controllership-router.js
          grep -q 'menuConsorcios' js/controllership-router.js
          grep -q 'garantirMenuConsorcios' js/controllership-router.js
          grep -q 'contratos.insertAdjacentElement("afterend",menu)' js/controllership-router.js
          if grep -Fq '["consorcios","Consórcios"]' js/controllership-router.js; then
            echo 'Consórcios não pode voltar ao submenu da Controladoria.' >&2
            exit 1
          fi

          grep -q '\["consorciosVisualizar","Visualizar consórcios"\]' js/profiles.js
          grep -q '\["consorciosEditar","Gerir consórcios"\]' js/profiles.js

          grep -q 'function consorciosVisualizar' firestore.rules
          grep -q 'function consorciosEditar' firestore.rules
          grep -q 'match /consorcios/' firestore.rules
          grep -q 'allow delete: if false;' firestore.rules

          # Contratos de cálculo e detalhamento.
          grep -q 'gerarCronogramaConsorcio' js/consortium-calculations.js
          grep -q 'consV1DetalheView' js/ctrl-consorcios-v1.js
          grep -q 'consV1TabelaParcelas' js/ctrl-consorcios-v1.js
          grep -q 'PDF da ficha' js/ctrl-consorcios-v1.js
          grep -q 'PDF parcelas' js/ctrl-consorcios-v1.js
          grep -q 'Excel parcelas' js/ctrl-consorcios-v1.js
          grep -q 'PDF carteira' js/ctrl-consorcios-v1.js
          grep -q 'Excel carteira' js/ctrl-consorcios-v1.js
          grep -q 'PROJEÇÃO · NÃO É EXTRATO' js/ctrl-consorcios-v1.js
          grep -q 'não cria histórico individual de pagamentos' js/ctrl-consorcios-v1.js
          grep -q 'exportarTabelaPdf' js/ctrl-consorcios-v1.js
          grep -q 'exportarTabelaXls' js/ctrl-consorcios-v1.js

          grep -q 'Gestão independente nesta versão' js/ctrl-consorcios-v1.js
          grep -q 'não alimenta DRE, Balanço, Fluxo de Caixa ou Budget/Forecast' js/ctrl-consorcios-v1.js
          grep -q 'taxaAdministracaoPct' js/ctrl-consorcios-v1.js
          grep -q 'jurosEncargosPct' js/ctrl-consorcios-v1.js
          grep -q 'valorParcelaAtual' js/ctrl-consorcios-v1.js
          grep -q 'valorPagoAcumulado' js/ctrl-consorcios-v1.js

          node --input-type=module <<'NODE'
          import { calcularConsorcio, gerarCronogramaConsorcio, statusConsorcioAtivo } from './js/consortium-calculations.js';
          const base={
            creditoContratado:100000,
            creditoAtual:100000,
            prazoMeses:60,
            parcelasPagas:12,
            taxaAdministracaoPct:15,
            fundoReservaPct:2,
            seguroOutrosPct:1,
            jurosEncargosPct:0,
            valorParcelaAtual:2100,
            dataInicio:'2026-01-10'
          };
          const r=calcularConsorcio(base);
          const perto=(a,b)=>Math.abs(a-b)<0.01;
          if(!perto(r.taxaConsorcioValor,18000))throw new Error('Taxa do consórcio divergente');
          if(!perto(r.totalEstimadoPlano,118000))throw new Error('Total estimado divergente');
          if(!perto(r.parcelaMediaEstimada,118000/60))throw new Error('Parcela média divergente');
          if(r.parcelasRestantes!==48)throw new Error('Parcelas restantes divergentes');
          if(!perto(r.saldoTeorico,(118000/60)*48))throw new Error('Saldo teórico divergente');
          if(!statusConsorcioAtivo('ativo')||!statusConsorcioAtivo('contemplado')||statusConsorcioAtivo('encerrado'))throw new Error('Status ativo divergente');
          const cron=gerarCronogramaConsorcio(base);
          if(cron.length!==60)throw new Error('Cronograma deve respeitar o prazo total');
          if(cron[0].status!=='paga'||cron[11].status!=='paga'||cron[12].status!=='a_vencer')throw new Error('Status do cronograma divergente');
          if(cron[0].competencia!=='01/2026'||cron[12].competencia!=='01/2027')throw new Error('Competência do cronograma divergente');
          if(!perto(cron[0].valorTeorico,118000/60))throw new Error('Parcela teórica divergente');
          if(!perto(cron[12].valorReferencia,2100))throw new Error('Parcela atual deve ser referência futura');
          NODE

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/sig-consorcios-server.log 2>&1 &
          echo $! > /tmp/sig-consorcios-server.pid
          sleep 2
      - name: Open Consorcios from main menu
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          cp index.html consorcios-smoke.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('consorcios-smoke.html')
          s=p.read_text()
          teste='''<script type="module">(async()=>{try{const core=await import('./js/core.js');await import('./js/controllership-router.js');core.state.perfil={id:'smoke',acessoTotal:true,permissoes:{}};core.state.usuario={id:'smoke-user',grupoId:'',empresaId:''};window.dispatchEvent(new Event('sig:ready'));const menu=document.getElementById('menuConsorcios');if(!menu)throw new Error('Menu Consórcios ausente');if(menu.classList.contains('hidden'))throw new Error('Menu Consórcios permaneceu oculto');if(menu.closest('#ctrlSubmenu'))throw new Error('Consórcios ainda está dentro do submenu da Controladoria');const contratos=document.getElementById('menuContratos');if(contratos?.nextElementSibling!==menu)throw new Error('Consórcios não ficou logo após Contratos');menu.click();await new Promise(r=>setTimeout(r,1500));const pg=document.getElementById('pagina-ctrl-consorcios-v1');if(!pg||pg.classList.contains('hidden'))throw new Error('Clique no menu não abriu Consórcios');if(!menu.classList.contains('ativo'))throw new Error('Menu Consórcios não ficou ativo');if(document.getElementById('menuControladoria')?.classList.contains('ativo'))throw new Error('Controladoria ficou ativa ao abrir Consórcios');if(pg.querySelector('.eyebrow')?.textContent!=='CONSÓRCIOS')throw new Error('Cabeçalho ainda identifica Consórcios como Controladoria');['consV1KpiAtivos','formConsorcioV1','consV1DetalheView','consV1TabelaParcelas','btnConsorciosPdfV1','btnConsorciosExcelV1','btnDetalhePdfV1','btnParcelasPdfV1','btnParcelasExcelV1'].forEach(id=>{if(!document.getElementById(id))throw new Error('Elemento de Consórcios ausente: '+id)});document.documentElement.setAttribute('data-consorcios-smoke','ok')}catch(e){document.documentElement.setAttribute('data-consorcios-smoke','fail');document.body.insertAdjacentHTML('beforeend','<pre id="consorcios-smoke-error">'+String(e.stack||e)+'</pre>')}})()</script>'''
          s=s.replace('</body>',teste+'</body>')
          p.write_text(s)
          PY
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom http://127.0.0.1:8000/consorcios-smoke.html > /tmp/consorcios-smoke-dom.html
          grep -q 'data-consorcios-smoke="ok"' /tmp/consorcios-smoke-dom.html
          grep -q 'id="menuConsorcios"' /tmp/consorcios-smoke-dom.html
          grep -q 'id="pagina-ctrl-consorcios-v1"' /tmp/consorcios-smoke-dom.html
          grep -q 'id="consV1DetalheView"' /tmp/consorcios-smoke-dom.html
          grep -q 'id="consV1TabelaParcelas"' /tmp/consorcios-smoke-dom.html
