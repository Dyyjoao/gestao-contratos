name: Apply Payables Rules Patch

on:
  push:
    branches:
      - feature/contas-a-pagar-cockpit
    paths:
      - '.github/workflows/payables-rules-patch.yml'

permissions:
  contents: write

jobs:
  patch-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/contas-a-pagar-cockpit
      - name: Add Accounts Payable Rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firestore.rules')
          s=p.read_text()
          helpers="""
    function contasPagarVisualizar() {
      return permissao('contasPagar','visualizar') ||
        permissao('contasPagar','cadastrar') ||
        permissao('contasPagar','editar') ||
        permissao('contasPagar','baixar');
    }
    function contasPagarCadastrar() { return permissao('contasPagar','cadastrar') || permissao('contasPagar','editar'); }
    function contasPagarEditar() { return permissao('contasPagar','editar'); }
    function contasPagarBaixar() { return permissao('contasPagar','baixar') || contasPagarEditar(); }

"""
          block="""
    match /contasPagar/{id} {
      allow read: if contasPagarVisualizar() && documentoAcessivel(resource.data);
      allow create: if contasPagarCadastrar() && documentoAcessivel(request.resource.data) &&
        request.resource.data.status == 'aberto';
      allow update: if documentoAcessivel(resource.data) &&
        request.resource.data.grupoId == resource.data.grupoId &&
        request.resource.data.empresaId == resource.data.empresaId && (
          administrador() ||
          (resource.data.status == 'aberto' && request.resource.data.status == 'pago' && contasPagarBaixar() &&
            request.resource.data.diff(resource.data).affectedKeys().hasOnly([
              'status','dataPagamento','pagoPor','atualizadoEm'
            ])) ||
          (resource.data.status == 'aberto' && request.resource.data.status == 'aberto' && resource.data.origem != 'contrato' && contasPagarEditar() &&
            request.resource.data.diff(resource.data).affectedKeys().hasOnly([
              'fornecedor','documento','descricao','categoria','valor','responsavel','observacao','vencimento','origem','atualizadoEm'
            ])) ||
          (resource.data.origem == 'contrato' && contasPagarCadastrar() &&
            request.resource.data.status in ['aberto','cancelado'] &&
            request.resource.data.diff(resource.data).affectedKeys().hasOnly([
              'fornecedor','descricao','documento','categoria','valor','vencimento','responsavel','observacao',
              'origem','origemContratoId','contratoReferencia','competencia','status','canceladoAutomatico','motivoCancelamento','atualizadoEm'
            ]))
        );
      allow delete: if false;
    }

"""
          if 'function contasPagarVisualizar()' not in s:
              anchor="    function frotaVisualizar() {"
              if anchor not in s: raise SystemExit('helper anchor not found')
              s=s.replace(anchor,helpers+anchor,1)
          if 'match /contasPagar/{id}' not in s:
              anchor="    match /prestacaoContas/{id} {"
              if anchor not in s: raise SystemExit('match anchor not found')
              s=s.replace(anchor,block+anchor,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add firestore.rules
          if git diff --cached --quiet; then
            echo 'Rules already present.'
            exit 0
          fi
          git commit -m 'feat: add isolated Firestore rules for accounts payable'
          git push origin HEAD:feature/contas-a-pagar-cockpit
