name: Harden Permuta Rules V2

on:
  push:
    branches: [chatgpt/corrige-t1-dre]
    paths: [.github/workflows/harden-permuta-rules-v2.yml]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/corrige-t1-dre
      - name: Make permuta movements append-only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firestore.rules')
          s=p.read_text()
          marker='    match /permutaMovimentos/{id} {'
          if marker not in s:
              raise SystemExit('Bloco permutaMovimentos não encontrado.')
          head,tail=s.split(marker,1)
          old="      allow update: if fpaEditar() && documentoAcessivel(resource.data) && request.resource.data.grupoId == resource.data.grupoId && request.resource.data.empresaId == resource.data.empresaId;\n      allow delete: if false;"
          if old not in tail:
              raise SystemExit('Regras de atualização não encontradas no bloco de permuta.')
          tail=tail.replace(old,"      allow update, delete: if false;",1)
          p.write_text(head+marker+tail)
          PY
      - name: Commit hardened rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "Torna movimentos de permuta imutáveis"
          git push origin HEAD:chatgpt/corrige-t1-dre
