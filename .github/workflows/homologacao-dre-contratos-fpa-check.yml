name: SIG Homologacao DRE Contratos FP&A Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Homologar congelamento V2
        shell: bash
        run: |
          set -e
          node --check js/contracts.js
          node --check js/payables-contracts.js
          node --check js/ctrl-input-v6.js
          node --check js/controllership-router.js
          ! grep -Eq 'planoContasGerencial|centrosCusto|fluxoCaixa|budgetLinhas|forecastLinhas|premissasPlanejamento|imobilizados' js/contracts.js
          ! grep -Eq 'contasBancarias|fluxoCaixa' js/payables-contracts.js
          ! grep -Eq 'CC_BALANCO|contaBalanco|mapaImobilizado|imobilizados' js/ctrl-input-v6.js
          ! grep -Eq '\["(dre|balanco|budget|forecast|premissas|imobilizado|caixa|prestacao)"' js/controllership-router.js
          ! grep -Eq 'contracts-fpa-account-guard|contract-driver-sync|ctrl-dre|ctrl-balance|ctrl-budget|ctrl-forecast|ctrl-premises|ctrl-assets|cashflow-admin-actions|accountability-pdf' app.js
          grep -A2 -F 'match /budgetLinhas/{id}' firestore.rules | grep -Fq 'allow read, write: if false;'
          grep -A2 -F 'match /forecastLinhas/{id}' firestore.rules | grep -Fq 'allow read, write: if false;'
