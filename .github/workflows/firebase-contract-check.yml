name: SIG Firebase Contract Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  firebase-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar barreiras Firestore V2
        shell: bash
        run: |
          set -e
          for col in planejamentoMensal imobilizados premissasPlanejamento budgetLinhas forecastLinhas classificacoesContas planejamentoDetalhes contasBancarias fluxoCaixaLancamentos fluxoCaixaFixos prestacaoContas prestacaoComentarios; do
            grep -A2 -F "match /$col/{id}" firestore.rules | grep -Fq 'allow read, write: if false;'
          done
          grep -A4 -F 'match /planoContasGerencial/{id}' firestore.rules | grep -Fq 'allow create, update, delete: if false;'
          grep -A4 -F 'match /centrosCusto/{id}' firestore.rules | grep -Fq 'allow create, update, delete: if false;'
          grep -A8 -F 'match /veiculos/{id}' firestore.rules | grep -Fq 'frotaFichaOperacionalValida()'
          ! grep -Fq 'fpaImobilizado()' firestore.rules
          ! grep -Fq 'fpaBudget()' firestore.rules
          ! grep -Fq 'fpaForecast()' firestore.rules
          ! grep -Fq 'caixaVisualizar()' firestore.rules
          ! grep -Fq 'prestacaoComentar()' firestore.rules
          grep -Fq 'match /vendas/{id}' firestore.rules
          grep -Fq 'match /colaboradores/{id}' firestore.rules
          grep -Fq 'match /planosAcao/{id}' firestore.rules
