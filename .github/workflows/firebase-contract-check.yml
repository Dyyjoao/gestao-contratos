name: SIG Firebase Contract Check

on:
  push:
    branches:
      - main
      - 'audit/**'
      - 'chatgpt/**'
      - 'hotfix/**'
      - 'feature/**'
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'js/shared.js'
      - 'js/permutas.js'
      - 'js/profiles.js'
      - 'js/asset-depreciation.js'
      - 'js/ctrl-assets-v1.js'
      - 'js/ctrl-consorcios-v1.js'
      - 'js/consortium-calculations.js'
      - 'js/ctrl-chart-accounts-v6.js'
      - 'docs/SIG-FIREBASE-DEPLOY-E-RULES.md'
      - 'docs/SIG-DOSSIE-DE-CONTINUIDADE.md'
      - 'docs/SIG-MANUAL-MESTRE.md'
      - 'docs/SIG-GUIA-DE-CONTINUIDADE.md'
      - 'docs/release-controladoria-modular.md'
      - '.github/workflows/firebase-contract-check.yml'
  pull_request:
    branches: [main]

jobs:
  firebase-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase release contract
        run: |
          set -e

          test -s firebase.json
          test -s .firebaserc
          test -s firestore.rules
          test -s storage.rules

          grep -q '"firestore"' firebase.json
          grep -q '"rules": "firestore.rules"' firebase.json
          grep -q '"storage"' firebase.json
          grep -q '"rules": "storage.rules"' firebase.json
          grep -q 'gestao-de-contratos-b266b' .firebaserc

          grep -q 'function fpaImobilizado' firestore.rules
          grep -q 'match /imobilizados/' firestore.rules
          grep -q "permissao('controladoria','imobilizado')" firestore.rules
          grep -q 'match /planoContasGerencial/' firestore.rules
          grep -q 'allow delete: if fpaPlano() && documentoAcessivel(resource.data);' firestore.rules

          grep -q 'function consorciosVisualizar' firestore.rules
          grep -q 'function consorciosEditar' firestore.rules
          grep -q 'match /consorcios/' firestore.rules
          grep -q "permissao('controladoria','consorciosVisualizar')" firestore.rules
          grep -q "permissao('controladoria','consorciosEditar')" firestore.rules
          grep -q 'listarDocumentos("consorcios")' js/ctrl-consorcios-v1.js
          grep -q 'criarDocumento("consorcios"' js/ctrl-consorcios-v1.js
          grep -q 'atualizarDocumento("consorcios"' js/ctrl-consorcios-v1.js

          # Permutas v2 é módulo operacional com coleção de fechamentos e ações separadas.
          grep -q 'function permutasVisualizar' firestore.rules
          grep -q 'function permutasCadastrar' firestore.rules
          grep -q 'function permutasMovimentar' firestore.rules
          grep -q 'function permutasEstornar' firestore.rules
          grep -q 'function permutasFechar' firestore.rules
          grep -q 'function permutasInativar' firestore.rules
          grep -q 'match /permutas/' firestore.rules
          grep -q 'match /permutaMovimentos/' firestore.rules
          grep -q 'match /permutaFechamentos/' firestore.rules
          grep -q 'permutasEstornar()' firestore.rules
          grep -q 'permutasFechar()' firestore.rules
          grep -q 'allow delete: if administrador() && documentoAcessivel(resource.data);' firestore.rules
          grep -q 'listarDocumentos("permutaFechamentos")' js/permutas.js
          grep -q 'reauthenticateWithCredential' js/permutas.js

          # Permutas pode consultar CC e plano apenas como lookup operacional.
          grep -q 'permutasVisualizar();' firestore.rules
          grep -q "permissao('controladoria','visualizar') || permutasVisualizar()" firestore.rules

          grep -q 'errosColecoes' js/shared.js
          grep -q 'exigirColecaoDisponivel' js/shared.js
          grep -q 'mensagemErroDados' js/shared.js
          grep -q 'formatarCpfCnpj' js/shared.js
          grep -q 'validarCpfCnpj' js/shared.js
          grep -q 'exigirColecaoDisponivel("imobilizados")' js/asset-depreciation.js
          grep -q 'exigirColecaoDisponivel("imobilizados")' js/ctrl-chart-accounts-v6.js
          grep -q 'usosParaExclusao' js/ctrl-chart-accounts-v6.js
          grep -q 'batch.delete' js/ctrl-chart-accounts-v6.js
          grep -q 'mensagemErroDados' js/ctrl-assets-v1.js
          grep -q 'mensagemErroDados' js/ctrl-consorcios-v1.js

          grep -q 'GitHub Pages' docs/SIG-FIREBASE-DEPLOY-E-RULES.md
          grep -q 'firebase deploy --only firestore:rules,storage' docs/SIG-FIREBASE-DEPLOY-E-RULES.md
          grep -q 'fail-closed' docs/SIG-DOSSIE-DE-CONTINUIDADE.md
          grep -q '01/09/2026' docs/SIG-MANUAL-MESTRE.md
          grep -q '01/09/2026' docs/SIG-GUIA-DE-CONTINUIDADE.md

          node --check js/shared.js
          node --check js/permutas.js
          node --check js/profiles.js
          node --check js/asset-depreciation.js
          node --check js/ctrl-assets-v1.js
          node --check js/consortium-calculations.js
          node --check js/ctrl-consorcios-v1.js
          node --check js/ctrl-chart-accounts-v6.js
