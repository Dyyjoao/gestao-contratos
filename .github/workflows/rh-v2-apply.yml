name: Apply RH v2 patch
on:
  push:
    branches: ['feature/rh-v2-config-modulos']
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply RH v2 generated patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rh-v2-config-modulos
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply-rh-v2.py
      - name: Commit generated changes
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'apply RH v2 generated patch'
          git push origin HEAD:feature/rh-v2-config-modulos
