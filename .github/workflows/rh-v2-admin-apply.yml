name: Apply RH v2 admin patch
on:
  push:
    branches: ['feature/rh-v2-config-modulos']
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply RH v2 admin patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rh-v2-config-modulos
          fetch-depth: 0
      - run: python3 tools/apply-rh-v2-admin.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/hr-culture.js firestore.rules
          git commit -m 'apply RH v2 admin patch'
          git push origin HEAD:feature/rh-v2-config-modulos
