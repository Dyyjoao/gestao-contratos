name: Apply RH header config ranking patch
on:
  push:
    branches: ['fix/rh-header-config-ranking']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rh-header-config-ranking
          fetch-depth: 0
      - run: python3 tools/apply-rh-header-config-ranking.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/hr-people.js js/module-settings.js .github/workflows/hr-people-check.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: reorganizar cabeçalho, configurações e rankings do RH'
          git push origin HEAD:fix/rh-header-config-ranking
