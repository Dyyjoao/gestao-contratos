name: SIG Service Orders Check
on:
  push:
    branches: [main, 'feature/**', 'chatgpt/**']
  pull_request:
    branches: [main]
jobs:
  os-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate order workflow
        run: |
          set -e
          node --check js/service-orders.js
          node --check js/service-orders-dashboard.js
          grep -q 'service-orders.js?v=8' app.js
          grep -q 'listarDocumentosGrupo("ordensServico")' js/service-orders.js
          grep -q 'criarDocumentoGrupo("ordensServico"' js/service-orders.js
          grep -q 'match /ordensServico/{id}' firestore.rules
          grep -q 'mesmoGrupo(resource.data.grupoId)' firestore.rules
          grep -q 'solicitadoPor == request.auth.uid' firestore.rules
          grep -q 'statusAlteradoEm' js/service-orders.js
          grep -q 'dataInicioPrevista' js/service-orders.js
          grep -q 'dataConclusaoPrevista' js/service-orders.js
          grep -q 'data-os-card-filter' js/service-orders.js
          grep -q 'ordensServico' js/profiles.js
