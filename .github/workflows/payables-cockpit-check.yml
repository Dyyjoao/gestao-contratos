name: SIG Contas a Pagar Check

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'js/payables.js'
      - 'js/payables-contracts.js'
      - 'js/payables-desk.js'
      - 'js/profiles.js'
      - 'app.js'
      - 'preview/contas-pagar/**'
      - '.github/workflows/payables-cockpit-check.yml'
  pull_request:
    branches: [main]

jobs:
  payables-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate independent Accounts Payable cockpit
        run: |
          set -e
          node --check js/payables.js
          node --check js/payables-contracts.js
          node --check js/payables-desk.js

          # Módulo independente e persistência própria.
          grep -Fq 'const COLECAO="contasPagar"' js/payables.js
          grep -Fq 'Contas a Pagar' js/payables.js
          grep -Fq 'Não alimenta DRE, Budget ou Forecast' js/payables.js
          ! grep -Eq 'budgetLinhas|forecastLinhas|realizadoMensal|planejamentoDetalhes' js/payables.js js/payables-contracts.js js/payables-desk.js

          # Cockpit: vencidos, hoje, 7/30 dias, baixa e recorrência.
          grep -Fq 'apKpiVencido' js/payables.js
          grep -Fq 'apKpiHoje' js/payables.js
          grep -Fq 'apKpi7' js/payables.js
          grep -Fq 'apKpi30' js/payables.js
          grep -Fq 'Repetir mensalmente' js/payables.js
          grep -Fq 'status:"pago"' js/payables.js

          # Correções administrativas auditáveis; sem exclusão física no módulo.
          grep -Fq 'confirmarAcaoAdministrativa' js/payables.js
          grep -Fq 'atualizarComAuditoria' js/payables.js
          grep -Fq 'estorno_conta_pagar' js/payables.js
          ! grep -Eq 'excluirDocumento|deleteDoc|batch\.delete' js/payables.js

          # Contratos podem alimentar AP sem depender de FP&A.
          grep -Fq 'contasPagarAtivo' js/payables-contracts.js
          grep -Fq 'Enviar ao Contas a Pagar' js/payables-contracts.js
          grep -Fq 'origem:"contrato"' js/payables-contracts.js
          grep -Fq 'origemContratoId' js/payables-contracts.js
          grep -Fq 'competencia' js/payables-contracts.js

          # Minha Mesa recebe alertas do cockpit.
          grep -Fq 'mesaContasPagarCard' js/payables-desk.js
          grep -Fq 'Vencidos' js/payables-desk.js
          grep -Fq 'Próx. 7 dias' js/payables-desk.js
          grep -Fq 'SIG_ABRIR_CONTAS_PAGAR' js/payables-desk.js

          # Permissões e carregamento.
          grep -Fq '["contasPagar","Contas a Pagar"' js/profiles.js
          grep -Fq 'import "./js/payables.js"' app.js
          grep -Fq 'import "./js/payables-contracts.js"' app.js
          grep -Fq 'import "./js/payables-desk.js"' app.js

          # Preview é isolado: nada de Firebase nem app real.
          test -s preview/contas-pagar/index.html
          ! grep -Eqi 'firebase|app\.js' preview/contas-pagar/index.html
