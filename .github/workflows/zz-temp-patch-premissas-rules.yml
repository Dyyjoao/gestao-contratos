name: Temporary premise rules patch

on:
  push:
    branches:
      - fix/premissas-exclusao-adm

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/premissas-exclusao-adm
          fetch-depth: 0
      - name: Allow audited admin physical delete for premises only
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firestore.rules')
          s=p.read_text()
          marker="match /premissasPlanejamento/{id} {"
          i=s.index(marker)
          j=s.index("\n    }", i)
          block=s[i:j]
          old="allow delete: if false;"
          new="allow delete: if administrador() && documentoAcessivel(resource.data);"
          if new in block:
              raise SystemExit(0)
          if old not in block:
              raise SystemExit('Premissas block no longer has expected delete=false contract')
          block=block.replace(old,new,1)
          p.write_text(s[:i]+block+s[j:])
          PY
          git diff --check
          git diff -- firestore.rules
          if git diff --quiet -- firestore.rules; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "fix: allow admin delete for premises"
          git push origin HEAD:fix/premissas-exclusao-adm