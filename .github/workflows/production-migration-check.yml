name: SIG Production Migration Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/production.js
          node --check js/production-dashboard.js
          node --check js/disposal.js
          node --check js/disposal-dashboard.js
          node --check js/area-navigation.js
          grep -Fq 'import "./js/production.js"' app.js
          grep -Fq 'import "./js/disposal.js"' app.js
          grep -Fq '["producao","Produção"' js/profiles.js
          grep -Fq '["descarte","Indústria · Perdas"' js/profiles.js
          grep -Fq 'producao:{label:"Produção"' js/area-navigation.js
          grep -Fq 'descarte:{label:"Perdas"' js/area-navigation.js
          grep -Fq 'match /descarteLancamentos/{id}' firestore.rules
