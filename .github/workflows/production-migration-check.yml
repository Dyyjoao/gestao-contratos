name: SIG Production Migration Check

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'chatgpt/**'
  pull_request:
    branches: [main]

jobs:
  production-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Production migration
        run: |
          set -e
          node --check js/production.js
          node --check js/production-dashboard.js
          node --check js/disposal.js
          node --check js/disposal-dashboard.js
          node --check js/area-navigation.js
          grep -q 'production.js' app.js
          grep -q 'production-dashboard.js' app.js
          grep -q 'id="pagina-producao"' js/production.js
          grep -q 'Quantidade produzida' js/production.js
          grep -q 'Horas trabalhadas' js/production.js
          grep -q 'Produção por hora' js/production.js
          grep -q 'Concretador' js/production.js
          grep -q 'Para LAJE' js/production.js
          grep -q 'BANDEJA' js/production.js
          grep -q 'producaoLancamentos' js/production.js
          grep -q 'operacaoCadastros' js/production.js
          grep -q 'Estornar ADM' js/production.js
          grep -q 'menuOperacao' js/area-navigation.js
          grep -q 'areaNav-producao' js/area-navigation.js || grep -q 'producao' js/area-navigation.js
          grep -q 'Operação · Produção' js/production-dashboard.js
          grep -q 'disposal.js' app.js
          grep -q 'disposal-dashboard.js' app.js
          grep -q 'descarteLancamentos' js/disposal.js
          grep -q 'match /descarteLancamentos/{id}' firestore.rules
          grep -q 'allow delete: if false;' firestore.rules
          grep -q '\["descarte","Operação · Descarte"' js/profiles.js
          grep -q 'descarte:{label:"Descarte"' js/area-navigation.js
          test -f production.css
