name: SIG Premissas + Frota Shortcut Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/fleet.js
          node --check js/fleet-detran-es.js
          grep -A2 -F 'match /premissasPlanejamento/{id}' firestore.rules | grep -Fq 'allow read, write: if false;'
          grep -Fq 'fleet.js?v=' app.js
          grep -Fq 'import "./js/fleet-detran-es.js"' app.js
          grep -Fq 'Detran ES · IPVA/Licenciamento' js/fleet-detran-es.js
          ! grep -Fq 'planoContasGerencial' js/fleet.js
          ! grep -Fq 'imobilizados' js/fleet.js
          ! grep -Fq 'integrarPlanejamento' js/fleet.js
          ! grep -Fq 'podeContabil' js/fleet.js
