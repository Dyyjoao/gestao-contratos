name: Area Navigation Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/area-navigation.js
          grep -Fq 'area-navigation.js?v=5' app.js
          grep -Fq 'const ordem=["menuMinhaMesa","menuDashboard","menuOperacao","operacaoSubmenu","menuComercial","comercialSubmenu","menuLogistica","logisticaSubmenu","menuCombustivel","menuControladoria","ctrlSubmenu","menuRh","rhSubmenu","menuGovernanca"]' js/area-navigation.js
          grep -Fq 'chaves:["pallets","frota"]' js/area-navigation.js
          grep -Fq 'chaves:["rh","avaliacoesrh","acoesrh","seguranca"]' js/area-navigation.js
          grep -Fq '$("menuSeguranca")?.remove()' js/area-navigation.js
          grep -Fq 'area:"logistica",modulo:"frota"' js/area-navigation.js
          grep -Fq 'area:"rh",modulo:"modincidentes"' js/area-navigation.js
          grep -Fq 'SIG_ABRIR_COMERCIAL' js/area-navigation.js
          grep -Fq 'SIG_ABRIR_FROTA' js/area-navigation.js
          grep -Fq 'SIG_ABRIR_RH_AVALIACOES' js/area-navigation.js
          grep -Fq 'SIG_ABRIR_RH_ACOES' js/area-navigation.js
