name: SIG Quality Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -e
          node --check app.js
          if grep -REn '^async[[:space:]]*$' js --include='*.js'; then
            echo "Erro: expressão async órfã encontrada."
            exit 1
          fi
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0 | sort -z)
      - name: Validar bundle V2
        shell: bash
        run: |
          set -e
          ! grep -Eq 'contracts-fpa-account-guard|contract-driver-sync|ctrl-dre|ctrl-balance|ctrl-budget|ctrl-forecast|ctrl-premises|ctrl-assets|cashflow-admin-actions|accountability-pdf|payables-cockpit-controls' app.js
          grep -Fq 'area-navigation.js?v=6' app.js
          grep -Fq 'controllership-router.js?v=34' app.js
          grep -Fq 'fleet.js?v=18' app.js
          grep -Fq 'input-admin-actions.js?v=2' app.js
          grep -Fq 'commercial-workflow.js?v=16' app.js
          grep -Fq 'service-orders.js?v=8' app.js
          grep -Fq 'pallets.js?v=2' app.js
          grep -Fq 'pallet-dashboard.js?v=2' app.js
          grep -Fq 'service-orders-dashboard.js?v=3' app.js
          grep -Fq 'hr-culture.js?v=6' app.js
          grep -Fq 'fleet-fuel.js?v=18' app.js
          ! grep -Fq 'fleet-cost-kpi.js' app.js

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar artefatos estáticos
        shell: bash
        run: |
          set -e
          test -s index.html
          test -s app.js
          test -s style.css
          grep -Fq 'app.js?v=135' index.html
