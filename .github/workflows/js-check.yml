name: SIG Quality Check

on:
  push:
    branches: [main, chatgpt/mascara-contas-balanco-centros, chatgpt/contas-estatisticas-dre-export, chatgpt/input-v4-limpeza-legado]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and architecture contracts
        run: |
          set -e
          node --check app.js
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

          grep -q 'grupoContexto' js/company-context.js
          grep -q 'empresasContexto' js/company-context.js
          grep -q 'periodoContexto' js/company-context.js
          grep -q 'browserSessionPersistence' js/core.js

          grep -q '__cc_estatistico__' js/statistical-center.js
          grep -q '__cc_balanco__' js/balance-center.js
          grep -q 'RAIZES_CONTABEIS' js/account-mask.js
          grep -q '"1".*ATIVO' js/account-mask.js
          grep -q '"2".*PASSIVO' js/account-mask.js
          grep -q '"3".*RECEITA' js/account-mask.js
          grep -q '"4".*DESPESA' js/account-mask.js
          grep -q '"9".*ESTATÍSTICA' js/account-mask.js
          grep -q 'proximoCodigoSintetico' js/account-mask.js
          grep -q 'proximoCodigoAnalitico' js/account-mask.js
          grep -q 'contaPaiId' js/account-tree.js
          grep -q 'contaAtivaNoExercicio' js/account-validity.js
          grep -q 'inativaAPartirExercicio' js/account-validity.js

          grep -q 'pagina-ctrl-plano-v6' js/ctrl-chart-accounts-v6.js
          grep -q 'Copiar para outra empresa' js/ctrl-chart-accounts-v6.js
          grep -q 'modoPreenchimento' js/ctrl-chart-accounts-v6.js
          grep -q 'manual' js/ctrl-chart-accounts-v6.js
          grep -q 'automatico' js/ctrl-chart-accounts-v6.js
          grep -q 'Grupo gerencial da DRE' js/ctrl-chart-accounts-v6.js
          grep -q 'usosAPartir' js/ctrl-chart-accounts-v6.js
          grep -q 'inativaAPartirExercicio' js/ctrl-chart-accounts-v6.js

          grep -q 'pagina-ctrl-centros-v2' js/ctrl-cost-centers-v2.js
          grep -q 'Salvar mantém você nesta tela' js/ctrl-cost-centers-v2.js
          grep -q 'abrirMatrizCentro' js/ctrl-cost-centers-v2.js
          grep -q 'raízes 3 Receita e 4 Despesa' js/center-account-matrix-v2.js
          grep -q 'contaAtivaNoExercicio' js/center-account-matrix-v2.js

          grep -q 'criarMatrizPlanejamentoV4' js/ctrl-planning-matrix-v4.js
          grep -q 'premissaParaCompetencia' js/ctrl-planning-matrix-v4.js
          grep -q 'Meses com premissa ficam bloqueados' js/ctrl-planning-matrix-v4.js
          grep -q 'contaAtivaNoExercicio' js/ctrl-planning-matrix-v4.js
          grep -q 'Ativo/Passivo são exclusivos do Balanço' js/ctrl-planning-matrix-v4.js
          grep -q 'Estatística automática' js/ctrl-planning-matrix-v4.js
          grep -q 'Abrir orçamento' js/ctrl-planning-matrix-v4.js
          grep -q 'Finalizar orçamento' js/ctrl-planning-matrix-v4.js
          grep -q 'Reabrir orçamento' js/ctrl-planning-matrix-v4.js
          grep -q 'Nova versão' js/ctrl-planning-matrix-v4.js
          grep -q 'RESULTADO / SALDO' js/ctrl-planning-matrix-v4.js
          grep -q 'definido no cabeçalho' js/ctrl-planning-matrix-v4.js
          grep -q 'criarMatrizPlanejamentoV4' js/ctrl-budget-v8.js
          grep -q 'criarMatrizPlanejamentoV4' js/ctrl-forecast-v6.js

          grep -q 'classificarHorizonteCaixa' js/my-desk.js
          grep -q 'Primeira ruptura' js/my-desk.js
          grep -q 'Caixa projetado negativo em' js/my-desk.js
          ! grep -q 'titulo:"Caixa projetado negativo em D+90"' js/my-desk.js

          grep -q 'pagina-ctrl-dre-v6' js/ctrl-dre-v6.js
          grep -q 'Expandir tudo' js/ctrl-dre-v6.js
          grep -q 'Recolher tudo' js/ctrl-dre-v6.js
          grep -q 'Exportar Excel' js/ctrl-dre-v6.js
          grep -q 'Imprimir / PDF' js/ctrl-dre-v6.js
          grep -q 'RESULTADO / SALDO DO PERÍODO' js/ctrl-dre-v6.js

          grep -q 'pagina-ctrl-input-v6' js/ctrl-input-v6.js
          grep -q 'Estatísticas / Indicadores' js/ctrl-input-v6.js
          grep -q 'Conta sintética · não lançável' js/ctrl-input-v6.js

          grep -q 'pagina-ctrl-premissas-v4' js/ctrl-premises-v4.js
          grep -q 'vigência mensal' js/ctrl-premises-v4.js
          grep -q 'contaAtivaNoExercicio' js/ctrl-premises-v4.js

          grep -q 'pagina-closing-v3' js/closing-v3.js
          grep -q 'duplicadoArquivado' js/closing-v3.js
          grep -q 'Inativar daqui em diante' js/closing-v3.js

          grep -q 'Prestação de Contas' docs/STATUS-ATUAL-E-PENDENCIAS.md
          grep -q 'Não alterar estrutura' docs/STATUS-ATUAL-E-PENDENCIAS.md

          grep -q './js/contracts.js' app.js
          ! grep -q './js/fleet.js' app.js
          ! grep -q './js/inventory.js' app.js
          ! grep -q './js/quotes.js' app.js
          ! grep -q './js/providers.js' app.js
          ! grep -q './js/monthly-input.js' app.js

          grep -q 'configuracoesControladoria' firestore.rules
          grep -q 'match /permutas/' firestore.rules
          grep -q 'match /permutaMovimentos/' firestore.rules

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/sig-server.log 2>&1 &
          echo $! > /tmp/sig-server.pid
          sleep 2
      - name: Open SIG in headless Chrome
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8000/ > /tmp/sig-dom.html
          grep -q 'id="pagina-contratos"' /tmp/sig-dom.html
          grep -q 'id="pagina-controladoria"' /tmp/sig-dom.html
          grep -q 'id="pagina-governanca"' /tmp/sig-dom.html
          grep -q 'id="btnEntrar"' /tmp/sig-dom.html
          grep -q 'id="ctrlSubmenu"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-frota"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-almoxarifado"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-cotacoes"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-prestadores"' /tmp/sig-dom.html
      - name: Import current and candidate Controladoria modules in browser
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cp index.html module-smoke.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('module-smoke.html')
          s=p.read_text()
          teste='''<script type="module">(async()=>{const mods=['account-mask.js','account-validity.js','premise-validity.js','balance-center.js','statistical-center.js','ctrl-chart-accounts-v6.js','center-account-matrix-v2.js','ctrl-cost-centers-v2.js','ctrl-planning-matrix-v4.js','ctrl-budget-v8.js','ctrl-forecast-v6.js','ctrl-dre-v6.js','ctrl-input-v6.js','ctrl-premises-v4.js','closing-v3.js'];for(const m of mods){try{await import('./js/'+m);document.documentElement.setAttribute('data-'+m.replaceAll('.','-'),'ok')}catch(e){document.documentElement.setAttribute('data-module-smoke','fail-'+m);document.body.insertAdjacentHTML('beforeend','<pre id="module-error">'+m+' :: '+String(e.stack||e)+'</pre>');return}}document.documentElement.setAttribute('data-module-smoke','ok')})()</script>'''
          p.write_text(s.replace('</body>',teste+'</body>'))
          PY
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=26000 --dump-dom http://127.0.0.1:8000/module-smoke.html > /tmp/module-dom.html
          if ! grep -q 'data-module-smoke="ok"' /tmp/module-dom.html; then
            grep -o '<pre id="module-error">[^<]*' /tmp/module-dom.html || true
            exit 1
          fi
          rm -f module-smoke.html
