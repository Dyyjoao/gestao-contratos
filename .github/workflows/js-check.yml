name: SIG Quality Check

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and architecture contracts
        run: |
          set -e
          node --check app.js
          for file in js/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

          # Contexto global e autenticação
          grep -q 'grupoContexto' js/company-context.js
          grep -q 'empresasContexto' js/company-context.js
          grep -q 'periodoContexto' js/company-context.js
          grep -q 'browserSessionPersistence' js/core.js

          # Rotas vigentes da Controladoria — a rota ativa é contrato
          grep -q 'ctrl-dre-v6.js' js/controllership-router.js
          grep -q 'ctrl-balance-sheet-v1.js' js/controllership-router.js
          grep -q 'ctrl-input-v6.js' js/controllership-router.js
          grep -q 'ctrl-budget-v7.js' js/controllership-router.js
          grep -q 'ctrl-forecast-v5.js' js/controllership-router.js
          grep -q 'ctrl-chart-accounts-v5.js' js/controllership-router.js
          grep -q 'ctrl-premises-v4.js' js/controllership-router.js
          grep -q 'ctrl-cost-centers-v2.js' js/controllership-router.js
          grep -q 'ctrl-assets-v1.js' js/controllership-router.js
          grep -q 'closing-v3.js' js/controllership-router.js

          # Atalhos de Configurações não podem reabrir cadastros legados
          grep -q 'SIG_ABRIR_CTRL?.(chave)' js/ctrl-settings.js
          ! grep -q 'SIG_ABRIR_CTRL_LEGADO?.(chave)' js/ctrl-settings.js

          # Plano, máscara e natureza contábil
          grep -q 'RAIZES_CONTABEIS' js/account-mask.js
          grep -q 'multiplicadorApresentacao' js/account-mask.js
          grep -q 'multiplicadorResultado' js/account-mask.js
          grep -q 'contaRedutora' js/account-mask.js
          grep -q 'pagina-ctrl-plano-v5' js/ctrl-chart-accounts-v5.js
          grep -q 'Natureza contábil' js/ctrl-chart-accounts-v5.js
          grep -q 'contaAtivaNoExercicio' js/ctrl-chart-accounts-v5.js

          # Centros técnicos e hierarquia
          grep -q 'CC_ESTATISTICO_ID' js/statistical-center.js
          grep -q '__cc_estatistico__' js/statistical-center.js
          grep -q 'CC_BALANCO_ID' js/balance-center.js
          grep -q '__cc_balanco__' js/balance-center.js
          grep -q 'tipoEstrutura' js/account-tree.js
          grep -q 'contaPaiId' js/account-tree.js
          grep -q 'folhasDescendentes' js/account-tree.js
          grep -q 'arvoreParaFolhas' js/account-tree.js
          grep -q 'contaDre' js/center-account-matrix-v2.js

          # Input e Balanço
          grep -q 'pagina-ctrl-input-v6' js/ctrl-input-v6.js
          grep -q 'Balanço Patrimonial' js/ctrl-input-v6.js
          grep -q 'Conta sintética · não lançável' js/ctrl-input-v6.js
          grep -q 'duplicadoArquivado' js/ctrl-input-v6.js
          grep -q 'pagina-ctrl-balanco-v1' js/ctrl-balance-sheet-v1.js
          grep -q 'posição de fechamento' js/ctrl-balance-sheet-v1.js
          grep -q 'multiplicadorApresentacao' js/ctrl-balance-sheet-v1.js

          # Budget / Forecast / Premissas / Imobilizado
          grep -q 'criarMatrizPlanejamentoV2' js/ctrl-budget-v7.js
          grep -q 'criarMatrizPlanejamentoV2' js/ctrl-forecast-v5.js
          grep -q 'tipoRegistro:"budget_meta"' js/ctrl-planning-matrix-v2.js
          grep -q 'premissaParaCompetencia' js/ctrl-planning-matrix-v2.js
          grep -q 'competenciaDoMes' js/ctrl-planning-matrix-v2.js
          grep -q 'mapaDepreciacaoPlanejamento' js/ctrl-planning-matrix-v2.js
          grep -q 'RESULTADO / SALDO' js/ctrl-planning-matrix-v2.js
          grep -q 'pagina-ctrl-premissas-v4' js/ctrl-premises-v4.js
          grep -q 'vigenciaInicio' js/ctrl-premises-v4.js
          grep -q 'periodosSobrepostos' js/ctrl-premises-v4.js
          grep -q 'pagina-ctrl-imobilizado-v1' js/ctrl-assets-v1.js
          grep -q 'dataDisponivelUso' js/ctrl-assets-v1.js
          grep -q 'integrarBalanco' js/ctrl-assets-v1.js
          grep -q 'integrarPlanejamento' js/ctrl-assets-v1.js
          grep -q 'depreciacaoCompetencia' js/asset-depreciation.js

          # DRE
          grep -q 'pagina-ctrl-dre-v6' js/ctrl-dre-v6.js
          grep -q 'Expandir tudo' js/ctrl-dre-v6.js
          grep -q 'Exportar Excel' js/ctrl-dre-v6.js
          grep -q 'multiplicadorResultado' js/ctrl-dre-v6.js
          grep -q 'RESULTADO / SALDO DO PERÍODO' js/ctrl-dre-v6.js

          # Fechamento, mesa, governança e PDF
          grep -q 'pagina-closing-v3' js/closing-v3.js
          grep -q 'duplicadoArquivado' js/closing-v3.js
          grep -q 'concluidas' js/my-desk.js
          grep -q 'SIG_ABRIR_CTRL?.("caixa")' js/my-desk.js
          ! grep -q 'listarDocumentos("cotacoes")' js/my-desk.js
          ! grep -q 'listarDocumentos("veiculos")' js/my-desk.js
          ! grep -q 'listarDocumentos("itensAlmoxarifado")' js/my-desk.js
          grep -q 'pagina-permutas' js/permutas.js
          grep -q 'complianceProgramasAuditoria' js/governance.js
          grep -q 'jspdf@2.5.2' js/accountability-pdf.js

          # Escopo ativo: módulos operacionais antigos não voltam por acidente
          grep -q './js/contracts.js' app.js
          ! grep -q './js/fleet.js' app.js
          ! grep -q './js/inventory.js' app.js
          ! grep -q './js/quotes.js' app.js
          ! grep -q './js/providers.js' app.js
          ! grep -q './js/monthly-input.js' app.js

          # Segurança e persistência
          grep -q 'match /imobilizados/' firestore.rules
          grep -q 'fpaImobilizado' firestore.rules
          grep -q 'configuracoesControladoria' firestore.rules
          grep -q 'match /permutas/' firestore.rules
          grep -q 'match /permutaMovimentos/' firestore.rules
          test -s SECURITY.md
          test -s docs/SIG-GUIA-DE-CONTINUIDADE.md
          test -s docs/SIG-DOSSIE-DE-CONTINUIDADE.md
          test -s docs/SIG-MANUAL-MESTRE.md

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/sig-server.log 2>&1 &
          echo $! > /tmp/sig-server.pid
          sleep 2
      - name: Open SIG in headless Chrome
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8000/ > /tmp/sig-dom.html
          grep -q 'id="pagina-contratos"' /tmp/sig-dom.html
          grep -q 'id="pagina-controladoria"' /tmp/sig-dom.html
          grep -q 'id="pagina-governanca"' /tmp/sig-dom.html
          grep -q 'id="btnEntrar"' /tmp/sig-dom.html
          grep -q 'id="ctrlSubmenu"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-frota"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-almoxarifado"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-cotacoes"' /tmp/sig-dom.html
          ! grep -q 'id="pagina-prestadores"' /tmp/sig-dom.html
          ! grep -q 'id="menuInputMensal"' /tmp/sig-dom.html
      - name: Import current Controladoria modules in browser
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cp index.html module-smoke.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('module-smoke.html')
          s=p.read_text()
          mods=[
            'account-mask.js','account-validity.js','premise-validity.js',
            'statistical-center.js','balance-center.js','account-tree.js',
            'asset-depreciation.js','asset-planning.js',
            'ctrl-chart-accounts-v5.js','ctrl-cost-centers-v2.js','ctrl-premises-v4.js',
            'ctrl-input-v6.js','ctrl-balance-sheet-v1.js','ctrl-assets-v1.js',
            'ctrl-planning-matrix-v2.js','ctrl-budget-v7.js','ctrl-forecast-v5.js',
            'ctrl-dre-v6.js','closing-v3.js'
          ]
          teste="<script type=\"module\">(async()=>{const mods="+repr(mods)+";for(const m of mods){try{await import('./js/'+m);document.documentElement.setAttribute('data-'+m.replaceAll('.','-'),'ok')}catch(e){document.documentElement.setAttribute('data-module-smoke','fail-'+m);document.body.insertAdjacentHTML('beforeend','<pre id=\"module-error\">'+m+' :: '+String(e.stack||e)+'</pre>');return}}document.documentElement.setAttribute('data-module-smoke','ok')})()</script>"
          p.write_text(s.replace('</body>',teste+'</body>'))
          PY
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=25000 --dump-dom http://127.0.0.1:8000/module-smoke.html > /tmp/module-dom.html
          if ! grep -q 'data-module-smoke="ok"' /tmp/module-dom.html; then
            grep -o '<pre id="module-error">[^<]*' /tmp/module-dom.html || true
            exit 1
          fi
          rm -f module-smoke.html
