name: SIG Quality Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe JavaScript
        shell: bash
        run: |
          set -e
          node --check app.js
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0 | sort -z)
      - name: Validar bundle V2
        shell: bash
        run: |
          set -e
          ! grep -Eq 'contracts-fpa-account-guard|contract-driver-sync|ctrl-dre|ctrl-balance|ctrl-budget|ctrl-forecast|ctrl-premises|ctrl-assets|cashflow-admin-actions|accountability-pdf|payables-cockpit-controls' app.js
          grep -Fq 'area-navigation.js?v=4' app.js
          grep -Fq 'controllership-router.js?v=33' app.js

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar artefatos estáticos
        shell: bash
        run: |
          set -e
          test -s index.html
          test -s app.js
          test -s styles.css
          grep -Fq 'app.js?v=126' index.html
