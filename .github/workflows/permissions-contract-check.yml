name: SIG Permissions Contract Check

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  permissions-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate permission contract
        run: |
          set -e
          node --check js/profiles.js
          node --check js/controllership-router.js
          node --check js/permutas.js
          node --check js/governance-security.js
          node --check js/ctrl-delinquency-v1.js

          # DRE e Balanço precisam ser permissões explícitas de perfil.
          grep -q '\["dre","Visualizar DRE Gerencial"\]' js/profiles.js
          grep -q '\["balanco","Visualizar Balanço Patrimonial"\]' js/profiles.js

          # Antifraude & TI tem acesso próprio no perfil e ações de gestão continuam segregadas.
          grep -q '\["antifraude","Visualizar Cockpit Antifraude & TI"\]' js/profiles.js
          grep -q 'permite("governanca","antifraude")' js/governance-security.js
          grep -q 'permite("governanca","configurar")' js/governance-security.js
          grep -q 'permite("governanca","auditar")' js/governance-security.js

          # Inadimplência tem consulta e gestão separadas e fica dentro da Controladoria.
          grep -q '\["inadimplencia","Visualizar Inadimplência & Aging"\]' js/profiles.js
          grep -q '\["inadimplenciaEditar","Gerir carteira de inadimplência"\]' js/profiles.js
          grep -q 'case"inadimplencia":return ctrlAcao("inadimplencia")||ctrlAcao("inadimplenciaEditar")' js/controllership-router.js
          grep -q 'ctrl-delinquency-v1.js' js/controllership-router.js
          grep -q '\["inadimplencia","Inadimplência & Aging"\]' js/controllership-router.js
          grep -q 'permite("controladoria","inadimplenciaEditar")' js/ctrl-delinquency-v1.js

          # Consórcios é módulo de primeiro nível.
          grep -q '\["consorcios","Consórcios",\[\["visualizar","Visualizar"\],\["editar","Gerir consórcios"\]\]\]' js/profiles.js
          if grep -Fq '["consorciosVisualizar","Visualizar consórcios"]' js/profiles.js; then
            echo 'Permissão visual de Consórcios não pode permanecer no bloco visível da Controladoria.' >&2
            exit 1
          fi
          grep -q 'menuConsorcios' js/controllership-router.js
          if grep -Fq '["consorcios","Consórcios"]' js/controllership-router.js; then
            echo 'Consórcios não pode ficar no submenu da Controladoria.' >&2
            exit 1
          fi

          # Permutas é módulo operacional próprio, fora da Controladoria.
          grep -q '\["permutas","Permutas"' js/profiles.js
          grep -q '\["visualizar","Visualizar"\]' js/profiles.js
          grep -q '\["movimentar","Registrar movimentações"\]' js/profiles.js
          grep -q '\["estornar","Estornar lançamentos"\]' js/profiles.js
          grep -q '\["fechar","Realizar fechamentos"\]' js/profiles.js
          grep -q '\["inativar","Inativar/Reativar"\]' js/profiles.js
          grep -q 'Exclusão física: somente Administrador' js/profiles.js
          grep -q 'menuPermutas' js/controllership-router.js
          grep -q 'moduloAcao("permutas"' js/controllership-router.js
          if grep -Fq '["permutas","Permutas"]' js/controllership-router.js; then
            echo 'Permutas não pode ficar no submenu da Controladoria.' >&2
            exit 1
          fi
          if grep -q 'case"permutas":return permite("controladoria"' js/controllership-router.js; then
            echo 'Permutas não pode depender da permissão de Controladoria.' >&2
            exit 1
          fi

          # Perfis legados com apenas Visualizar mantêm acesso a DRE/Balanço até serem salvos novamente.
          grep -q 'legadoVisualizar:true' js/controllership-router.js
          grep -q '\["dre","balanco"\].*p?.controladoria?.visualizar' js/profiles.js

          # O submenu deve ser recalculado a cada login/página.
          grep -q 'aplicarPermissoesSubmenu' js/controllership-router.js
          grep -q 'window.addEventListener("sig:ready"' js/controllership-router.js
          grep -q 'classList.toggle("hidden",!ok)' js/controllership-router.js

          # A própria ação precisa bloquear abertura sem permissão.
          grep -q 'validarPermissao(chave)' js/controllership-router.js
          grep -q 'Seu perfil não possui permissão' js/controllership-router.js

          # Imports dinâmicos não podem reutilizar instância entre usuários/perfis.
          grep -q 'state.usuario?.id' js/controllership-router.js
          grep -q 'state.perfil?.id' js/controllership-router.js
