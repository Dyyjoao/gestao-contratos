name: SIG Permissions Contract Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  permissions-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/profiles.js
          node --check js/controllership-router.js
          node --check js/area-navigation.js
          for area in "Minha Mesa" "Dashboard" "Indústria" "Comercial" "Logística" "Combustível e Diesel" "Controladoria" "RH" "Gov. & Compliance"; do
            grep -Fq "[\"$area\",[" js/profiles.js
          done
          grep -Fq '["frota","Gestão de Frota"' js/profiles.js
          grep -Fq '["modincidentes","Segurança do Trabalho · Ocorrências"' js/profiles.js
          grep -Fq 'frota:{label:"Frota",root:"menuFrota",area:"logistica"' js/area-navigation.js
          grep -Fq 'seguranca:{label:"Segurança do Trabalho",root:"menuseguranca",area:"rh"' js/area-navigation.js
          ! grep -Eq '\["(dre|balanco|budget|forecast|premissas|imobilizado|caixa|prestacao)"' js/profiles.js
          ! grep -Eq '\["(dre|balanco|budget|forecast|premissas|imobilizado|caixa|prestacao)"' js/controllership-router.js
