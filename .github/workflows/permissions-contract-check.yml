name: SIG Permissions Contract Check

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
      - 'hotfix/**'
  pull_request:
    branches: [main]

jobs:
  permissions-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate permission contract
        run: |
          set -e
          node --check js/profiles.js
          node --check js/controllership-router.js

          # DRE e Balanço precisam ser permissões explícitas de perfil.
          grep -q '\["dre","Visualizar DRE Gerencial"\]' js/profiles.js
          grep -q '\["balanco","Visualizar Balanço Patrimonial"\]' js/profiles.js

          # Todo módulo navegável novo deve possuir bloco próprio na grade de Perfis.
          # Consórcios é módulo de primeiro nível e não pode continuar exposto como ação visual da Controladoria.
          grep -q '\["consorcios","Consórcios",\[\["visualizar","Visualizar"\],\["editar","Gerir consórcios"\]\]\]' js/profiles.js
          if grep -Fq '["consorciosVisualizar","Visualizar consórcios"]' js/profiles.js; then
            echo 'Permissão visual de Consórcios não pode permanecer no bloco visível da Controladoria.' >&2
            exit 1
          fi
          if grep -Fq '["consorciosEditar","Gerir consórcios"]' js/profiles.js; then
            echo 'Permissão de gestão de Consórcios não pode permanecer no bloco visível da Controladoria.' >&2
            exit 1
          fi

          # Compatibilidade temporária: ao salvar o novo bloco, espelhar as chaves legadas
          # usadas pelo roteador/Rules atuais para não retirar acesso de perfis existentes.
          grep -q 'consorciosVisualizar:cons.visualizar===true||cons.editar===true' js/profiles.js
          grep -q 'consorciosEditar:cons.editar===true' js/profiles.js
          grep -q 'c.dataset.modulo==="consorcios"' js/profiles.js
          grep -q 'p?.controladoria?.consorciosVisualizar' js/profiles.js
          grep -q 'p?.controladoria?.consorciosEditar' js/profiles.js

          # Consórcios permanece fora do submenu da Controladoria e o roteador continua protegido.
          grep -q 'case"consorcios"' js/controllership-router.js
          grep -q 'ctrlAcao("consorciosVisualizar")||ctrlAcao("consorciosEditar")' js/controllership-router.js
          grep -q 'ctrl-consorcios-v1.js' js/controllership-router.js
          grep -q 'menuConsorcios' js/controllership-router.js
          if grep -Fq '["consorcios","Consórcios"]' js/controllership-router.js; then
            echo 'Consórcios não pode ficar no submenu da Controladoria.' >&2
            exit 1
          fi

          # Perfis legados com apenas Visualizar mantêm acesso a DRE/Balanço até serem salvos novamente.
          grep -q 'legadoVisualizar:true' js/controllership-router.js
          grep -q '\["dre","balanco"\].*p?.controladoria?.visualizar' js/profiles.js

          # O submenu deve ser recalculado a cada login/página e nunca ficar herdado do usuário anterior.
          grep -q 'aplicarPermissoesSubmenu' js/controllership-router.js
          grep -q 'window.addEventListener("sig:ready"' js/controllership-router.js
          grep -q 'classList.toggle("hidden",!ok)' js/controllership-router.js

          # A própria ação precisa bloquear abertura sem permissão, não apenas esconder o botão.
          grep -q 'validarPermissao(chave)' js/controllership-router.js
          grep -q 'Seu perfil não possui permissão' js/controllership-router.js

          # Imports dinâmicos não podem reutilizar a mesma instância entre usuários/perfis.
          grep -q 'state.usuario?.id' js/controllership-router.js
          grep -q 'state.perfil?.id' js/controllership-router.js
