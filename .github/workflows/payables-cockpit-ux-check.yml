name: SIG Payables Cockpit UX Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cockpit-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/payables.js
          node --check js/payables-cockpit-ui.js
          node --check js/payables-contracts.js
          grep -Fq 'import "./js/payables-cockpit-ui.js"' app.js
          grep -Fq 'import "./js/payables-contracts.js"' app.js
          ! grep -Fq 'payables-cockpit-controls.js' app.js
          grep -Fq 'contratoContasPagarAtivo' js/payables-contracts.js
          grep -Fq 'contratoDiaVencimentoAp' js/payables-contracts.js
          ! grep -Fq 'contasBancarias' js/payables-contracts.js
          ! grep -Fq 'contaBancariaIdContasPagar' js/payables-contracts.js
