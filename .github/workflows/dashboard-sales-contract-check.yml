name: SIG Dashboard Sales Contract Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/dashboard-v2.js
          node --check js/dashboard-cockpit-v2.js
          node --check js/sales.js
          node --check js/sales-guard.js
          node --check js/area-navigation.js
          grep -Fq 'import "./js/dashboard-v2.js"' app.js
          grep -Fq '["vendas","Vendas & Comissões"' js/profiles.js
          grep -Fq 'vendas:{label:"Vendas"' js/area-navigation.js
          grep -Fq 'permite("vendas","comissoes")' js/sales-guard.js
          grep -Fq 'match /vendas/{id}' firestore.rules
          ! grep -Fq '["vendas","Vendas & Comissões"]' js/controllership-router.js

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar bundle estático
        shell: bash
        run: |
          test -s index.html
          test -s app.js
          grep -Fq 'app.js?v=' index.html
