name: SIG Fleet Contract Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fleet-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/fleet.js
          node --check js/fleet-central.js
          node --check js/fleet-admin-actions.js
          node --check js/area-navigation.js
          grep -Fq 'fleet.js?v=' app.js
          grep -Fq 'frota:{label:"Frota",root:"menuFrota",area:"logistica"' js/area-navigation.js
          grep -Fq '["frota","Gestão de Frota"' js/profiles.js
          ! grep -Fq 'planoContasGerencial' js/fleet.js
          ! grep -Fq 'imobilizados' js/fleet.js
          ! grep -Fq 'contaAtivoId' js/fleet.js
          ! grep -Fq 'podeContabil' js/fleet.js
          grep -A2 -F 'match /imobilizados/{id}' firestore.rules | grep -Fq 'allow read, write: if false;'
          grep -Fq 'function frotaObrigacaoUpdateValida' firestore.rules
          grep -Fq 'function frotaKmUpdateValida' firestore.rules
          grep -Fq 'frotaAvisoCarga' js/fleet.js
          grep -Fq 'sem veículos cadastrados' js/fleet.js
          ! grep -Fq 'fleet-cost-kpi.js' app.js
          grep -Fq 'podeVerCombustivel' js/fleet.js
          grep -Fq 'lerSeguro("abastecimentosFrota",podeVerCombustivel())' js/fleet.js
          grep -Fq "sem veículos cadastrados" js/fleet-cost-kpi.js
          grep -Fq "ids.has(String(x.veiculoId" js/fleet-cost-kpi.js

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar bundle estático
        shell: bash
        run: |
          test -s index.html
          test -s app.js
          grep -Fq 'app.js?v=' index.html
