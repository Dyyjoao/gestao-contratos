name: SIG Sales Import Contract Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar importações comerciais
        shell: bash
        run: |
          set -e
          node --check js/sales.js
          node --check js/sales-pangeia-import.js
          node --check js/sales-report-import.js
          node --check js/receipts-report-import.js
          grep -Fq 'sales-report-import.js?v=' app.js
          grep -Fq 'vendas' js/sales-report-import.js
          grep -Fq 'vendedores' js/sales.js
          grep -Fq 'match /vendas/{id}' firestore.rules

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar integração estática
        shell: bash
        run: |
          set -e
          test -s index.html
          test -s app.js
          grep -Fq 'menuComercial' index.html
