name: SIG Sales Import Contract Check

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'chatgpt/**'
    paths:
      - 'app.js'
      - 'js/import-center.js'
      - 'js/sales-report-import.js'
      - 'sales-import.css'
      - 'js/sales.js'
      - 'js/hr-people.js'
      - 'firestore.rules'
      - '.github/workflows/sales-import-contract-check.yml'
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate commercial sales import architecture
        run: |
          set -e
          node --check app.js
          node --check js/import-center.js
          node --check js/sales-report-import.js
          node --check js/hr-people.js
          test -s sales-import.css

          grep -q './js/sales-report-import.js' app.js
          grep -q 'parseMatrizRelatorioVendas' js/sales-report-import.js
          grep -q 'CDCLIENTE' js/sales-report-import.js
          grep -q 'CDFUNCIONARIOVENDA' js/sales-report-import.js
          grep -q 'VALORVENDA' js/sales-report-import.js
          grep -q 'codigoVendedor' js/hr-people.js
          grep -q 'importacaoLoteId' js/sales-report-import.js
          grep -q 'importacoesVendas' js/sales-report-import.js
          grep -q 'importacoesVendasAlteracoes' js/sales-report-import.js
          grep -q 'classificarLinha' js/sales-report-import.js
          grep -q 'vendaPorPedido' js/sales-report-import.js
          grep -q 'vendaImportadaSincronizavel' firestore.rules
          grep -q 'Excluir lote' js/sales-report-import.js
          grep -q 'match /importacoesVendas/{id}' firestore.rules
          grep -q 'match /clientesComerciais/{id}' firestore.rules

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/sig-sales-report-server.log 2>&1 &
          sleep 2
      - name: Parse sales matrix and mount importer in headless Chrome
        run: |
          set -e
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          cp index.html sales-report-smoke.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sales-report-smoke.html')
          s=p.read_text()
          marker='</body>'
          test=r'''<script type="module">(async()=>{try{
            const core=await import('./js/core.js');
            core.state.usuario={id:'smoke',grupoId:'g',empresaId:'e'};
            core.state.perfil={id:'administrador',acessoTotal:true,ativo:true};
            await import('./js/sales.js');
            const imp=await import('./js/sales-report-import.js');
            const matrix=[
              ['CD_CLIENTE','NOME_PESSOA','CIDADE_PESSOA','UF_PESSOA','CD_VENDA','CD_LOJA','CD_FUNCIONARIOVENDA','NOME_FUNCIONARIO','DATA_VENDA','VALOR_VENDA'],
              [1001,'CLIENTE TESTE','SERRA','ES',50001,1,'77','VENDEDOR TESTE',46267.356944444444,1234.56]
            ];
            const r=imp.parseMatrizRelatorioVendas(matrix);
            if(r.linhas.length!==1)throw new Error('linhas '+r.linhas.length);
            if(r.linhas[0].clienteCodigo!=='1001')throw new Error('cliente');
            if(r.linhas[0].vendedorCodigo!=='77')throw new Error('vendedor');
            if(r.linhas[0].data!=='2026-09-02')throw new Error('data '+r.linhas[0].data);
            if(Math.abs(r.linhas[0].valor-1234.56)>0.001)throw new Error('valor '+r.linhas[0].valor);
            if(!document.getElementById('btnSalesReportImport'))throw new Error('botão importação ausente');
            if(!document.getElementById('salesReportHistorico'))throw new Error('histórico de importações ausente');
            document.documentElement.setAttribute('data-sales-report-smoke','ok');
          }catch(e){document.documentElement.setAttribute('data-sales-report-smoke','fail');document.body.insertAdjacentHTML('beforeend','<pre id="sales-report-error">'+String(e.stack||e)+'</pre>')}})();</script>'''
          p.write_text(s.replace(marker,test+marker))
          PY
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom http://127.0.0.1:8000/sales-report-smoke.html > /tmp/sig-sales-report-dom.html || true
          grep -q 'data-sales-report-smoke="ok"' /tmp/sig-sales-report-dom.html || { grep -A10 -B2 'sales-report-error' /tmp/sig-sales-report-dom.html || true; exit 1; }
