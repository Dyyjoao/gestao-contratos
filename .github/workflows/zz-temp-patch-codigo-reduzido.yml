name: Temporary codigo reduzido patch

on:
  push:
    branches:
      - feature/storage-contratos-codigo-reduzido

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/storage-contratos-codigo-reduzido
          fetch-depth: 0
      - name: Apply codigo reduzido to active accounting surfaces
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path); s=p.read_text()
              for old,new in replacements:
                  if old not in s:
                      raise SystemExit(f'{path}: expected fragment not found: {old[:100]!r}')
                  s=s.replace(old,new,1)
              p.write_text(s)

          patch('js/ctrl-chart-accounts-v6.js', [
            ('<div class="campo campo-span-2"><label for="contaV6Nome">Conta gerencial</label><input id="contaV6Nome" required></div><div class="campo"><label>Vigência</label><div id="contaV6Vigencia" class="fpa-contexto-chip">—</div></div>',
             '<div class="campo campo-span-2"><label for="contaV6Nome">Conta gerencial</label><input id="contaV6Nome" required></div><div class="campo"><label for="contaV6CodigoReduzido">Código reduzido (Pangeia)</label><input id="contaV6CodigoReduzido" maxlength="40" placeholder="Ex.: 125"><small>Referência externa opcional; não altera a hierarquia do SIG.</small></div><div class="campo"><label>Vigência</label><div id="contaV6Vigencia" class="fpa-contexto-chip">—</div></div>'),
            ('.plano-v6-pill.redutora{background:#fff0f0;color:#a12b2b}', '.plano-v6-pill.redutora{background:#fff0f0;color:#a12b2b}.plano-v6-pill.reduzido{background:#eef4ff;color:#3448a8;margin-left:5px}'),
            ('function naturezaHtml(c,r=""){', 'function reduzidoHtml(c){const r=String(c?.codigoReduzido||"").trim();return r?`<span class="plano-v6-pill reduzido">Red. ${esc(r)}</span>`:""}\nfunction naturezaHtml(c,r=""){'),
            ('<span>${esc(s1.nome)}</span></div></td>', '<span>${esc(s1.nome)}${reduzidoHtml(s1)}</span></div></td>'),
            ('<span>${esc(s2.nome)}</span></div></td>', '<span>${esc(s2.nome)}${reduzidoHtml(s2)}</span></div></td>'),
            ('<span>${esc(a.nome)}</span></div></td>', '<span>${esc(a.nome)}${reduzidoHtml(a)}</span></div></td>'),
            ('<span>${esc(l.nome||"")}</span></div></td>', '<span>${esc(l.nome||"")}${reduzidoHtml(l)}</span></div></td>'),
            ('$("contaV6Nome").value=nome||"";', '$("contaV6Nome").value=nome||"";$("contaV6CodigoReduzido").value=conta?.codigoReduzido||"";'),
            ('const d={nome};', 'const d={nome,codigoReduzido:$("contaV6CodigoReduzido")?.value.trim()||""};'),
            ('codigo,nome,status:"ativo"', 'codigo,nome,codigoReduzido:$("contaV6CodigoReduzido")?.value.trim()||"",status:"ativo"'),
            ('"atualizadoEm","contaPaiId"]', '"atualizadoEm","contaPaiId","codigoReduzido"]')
          ])

          patch('js/ctrl-input-v6.js', [
            ('function contaPorId(id){return plano.find(x=>x.id===id)}', 'function contaPorId(id){return plano.find(x=>x.id===id)}\nfunction reduzidoHtml(c){const r=String(c?.codigoReduzido||"").trim();return r?` <span class="input-v6-reduzido">Red. ${esc(r)}</span>`:""}'),
            ('.input-v6-auto{font-size:8px;border-radius:999px;padding:2px 6px;background:#eaf5f3;color:#087a6f;margin-left:5px}', '.input-v6-auto{font-size:8px;border-radius:999px;padding:2px 6px;background:#eaf5f3;color:#087a6f;margin-left:5px}.input-v6-reduzido{font-size:8px;border-radius:999px;padding:2px 6px;background:#eef4ff;color:#3448a8;margin-left:5px}'),
            ('<strong>${esc(c.codigo||"")}</strong> · ${esc(c.nome||"")}${red?', '<strong>${esc(c.codigo||"")}</strong> · ${esc(c.nome||"")}${reduzidoHtml(c)}${red?'),
            ('<strong>${esc(c.codigo||"")}</strong> · ${esc(c.nome||"")}</span>', '<strong>${esc(c.codigo||"")}</strong> · ${esc(c.nome||"")}${reduzidoHtml(c)}</span>')
          ])

          patch('js/ctrl-planning-matrix-v2.js', [
            ('const fmt=(v,c)=>contaEstatistica(c)?fmtStat(v,c):moeda(v);', 'const fmt=(v,c)=>contaEstatistica(c)?fmtStat(v,c):moeda(v);\nconst reduzidoHtml=c=>{const r=String(c?.codigoReduzido||"").trim();return r?` <span class="planning-v2-reduzido">Red. ${esc(r)}</span>`:""};'),
            ('${esc(conta.codigo||"")} · ${esc(conta.nome||"")}</span>`', '${esc(conta.codigo||"")} · ${esc(conta.nome||"")}${reduzidoHtml(conta)}</span>`'),
            ('.budget-cycle-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:end}', '.budget-cycle-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:end}.planning-v2-reduzido{display:inline-block;border-radius:999px;padding:2px 6px;background:#eef4ff;color:#3448a8;font-size:8px;margin-left:5px}')
          ])

          patch('js/ctrl-dre-v6.js', [
            ('function contasContexto(){const ids=new Set(empresasSelecionadasIds()),ano=periodoAno();return plano.filter(c=>ids.has(c.empresaId)&&contaAtivaNoExercicio(c,ano))}', 'function contasContexto(){const ids=new Set(empresasSelecionadasIds()),ano=periodoAno();return plano.filter(c=>ids.has(c.empresaId)&&contaAtivaNoExercicio(c,ano))}\nfunction reduzidoHtml(c){const r=String(c?.codigoReduzido||"").trim();return r?` <span class="dre-v6-reduzido">Red. ${esc(r)}</span>`:""}\nfunction reduzidoConsolidado(cs){const rs=[...new Set((cs||[]).map(c=>String(c?.codigoReduzido||"").trim()).filter(Boolean))];return rs.length===1?` <span class="dre-v6-reduzido">Red. ${esc(rs[0])}</span>`:rs.length>1?` <span class="dre-v6-reduzido warn">Red. diversos</span>`:""}'),
            ('.dre-v6-warn{display:inline-block;border-radius:999px;padding:2px 6px;background:#fff3e8;color:#9a4e00;font-size:8px;margin-left:5px}', '.dre-v6-warn{display:inline-block;border-radius:999px;padding:2px 6px;background:#fff3e8;color:#9a4e00;font-size:8px;margin-left:5px}.dre-v6-reduzido{display:inline-block;border-radius:999px;padding:2px 6px;background:#eef4ff;color:#3448a8;font-size:8px;margin-left:5px}.dre-v6-reduzido.warn{background:#fff3e8;color:#9a4e00}'),
            ('<span>${esc(c.codigo||"")} · ${esc(c.nome||"")}</span>', '<span>${esc(c.codigo||"")} · ${esc(c.nome||"")}${reduzidoHtml(c)}</span>'),
            ('<strong>${esc(item.codigo)}</strong> · ${esc(item.nome)}${warn.map', '<strong>${esc(item.codigo)}</strong> · ${esc(item.nome)}${reduzidoConsolidado(item.contas)}${warn.map'),
            ('<strong>${esc(codigo)}</strong> · ${esc(nomeSinteticaCodigo(codigo))}</span>', '<strong>${esc(codigo)}</strong> · ${esc(nomeSinteticaCodigo(codigo))}${reduzidoConsolidado(contasContexto().filter(c=>c.codigo===codigo))}</span>')
          ])

          patch('js/ctrl-balance-sheet-v1.js', [
            ('function contasContexto(){const mapa=new Map();for(const ano of anosEstrutura())for(const c of contasAtivasAno(ano))mapa.set(c.id,c);return[...mapa.values()]}', 'function contasContexto(){const mapa=new Map();for(const ano of anosEstrutura())for(const c of contasAtivasAno(ano))mapa.set(c.id,c);return[...mapa.values()]}\nfunction reduzidoConsolidado(cs){const rs=[...new Set((cs||[]).map(c=>String(c?.codigoReduzido||"").trim()).filter(Boolean))];return rs.length===1?` <span class="balanco-v1-reduzido">Red. ${esc(rs[0])}</span>`:rs.length>1?` <span class="balanco-v1-reduzido warn">Red. diversos</span>`:""}'),
            ('.balanco-v1-pill.warn{background:#fff3e8;color:#9a4e00}', '.balanco-v1-pill.warn{background:#fff3e8;color:#9a4e00}.balanco-v1-reduzido{display:inline-block;border-radius:999px;padding:2px 6px;background:#eef4ff;color:#3448a8;font-size:8px;margin-left:5px}.balanco-v1-reduzido.warn{background:#fff3e8;color:#9a4e00}'),
            ('<strong>${esc(codigo)}</strong> · ${esc(nomeCodigo(codigo))}${red?', '<strong>${esc(codigo)}</strong> · ${esc(nomeCodigo(codigo))}${reduzidoConsolidado(cs)}${red?'),
            ('<strong>${esc(codigo)}</strong> · ${esc(cadastrada?nomeCodigo(codigo):"Sintética de reconciliação")}${!cadastrada?', '<strong>${esc(codigo)}</strong> · ${esc(cadastrada?nomeCodigo(codigo):"Sintética de reconciliação")}${reduzidoConsolidado(contasContexto().filter(c=>c.codigo===codigo))}${!cadastrada?'),
            ('<strong>${esc(c.codigo||"SEM CÓDIGO")}</strong> · ${esc(c.nome||"Conta legada")}<span', '<strong>${esc(c.codigo||"SEM CÓDIGO")}</strong> · ${esc(c.nome||"Conta legada")}${reduzidoConsolidado([c])}<span')
          ])

          for f in ['js/ctrl-chart-accounts-v6.js','js/ctrl-input-v6.js','js/ctrl-planning-matrix-v2.js','js/ctrl-dre-v6.js','js/ctrl-balance-sheet-v1.js']:
              pass
          PY
          node --check js/ctrl-chart-accounts-v6.js
          node --check js/ctrl-input-v6.js
          node --check js/ctrl-planning-matrix-v2.js
          node --check js/ctrl-dre-v6.js
          node --check js/ctrl-balance-sheet-v1.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ctrl-chart-accounts-v6.js js/ctrl-input-v6.js js/ctrl-planning-matrix-v2.js js/ctrl-dre-v6.js js/ctrl-balance-sheet-v1.js
          git commit -m "feat: add manual Pangeia reduced account code"
          git push origin HEAD:feature/storage-contratos-codigo-reduzido