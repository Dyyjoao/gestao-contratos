name: SIG Codigo Reduzido Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar contrato V2
        shell: bash
        run: |
          set -e
          node --check js/ctrl-input-v6.js
          grep -Fq 'input-v6-reduzido' js/ctrl-input-v6.js
          grep -Fq 'codigoReduzido' js/ctrl-input-v6.js
          ! grep -Fq 'import "./js/account-reduced-code-ui.js"' app.js
          grep -A4 -F 'match /planoContasGerencial/{id}' firestore.rules | grep -Fq 'allow create, update, delete: if false;'
          grep -A4 -F 'match /centrosCusto/{id}' firestore.rules | grep -Fq 'allow create, update, delete: if false;'
