name: SIG Storage + Codigo Reduzido Check

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - 'js/storage.js'
      - 'js/contracts-storage.js'
      - 'js/account-reduced-code-ui.js'
      - 'js/ctrl-chart-accounts-v6.js'
      - 'js/ctrl-input-v6.js'
      - 'js/ctrl-dre-v6.js'
      - 'js/ctrl-balance-sheet-v1.js'
      - 'js/ctrl-planning-matrix-v2.js'
      - 'app.js'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/storage-reduced-code-check.yml'
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Firebase Storage and Pangeia reduced code contract
        run: |
          set -e
          node --check js/storage.js
          node --check js/contracts-storage.js
          node --check js/account-reduced-code-ui.js
          node --check js/ctrl-chart-accounts-v6.js
          node --check js/ctrl-input-v6.js
          node --check js/ctrl-dre-v6.js
          node --check js/ctrl-balance-sheet-v1.js
          node --check js/ctrl-planning-matrix-v2.js

          # Storage: bucket configurado, arquivo por grupo/empresa e exclusão física só Admin.
          grep -Fq 'storageBucket:"gestao-de-contratos-b266b.firebasestorage.app"' js/core.js
          grep -Fq '"storage"' firebase.json
          grep -Fq '"rules": "storage.rules"' firebase.json
          grep -Fq 'request.resource.size <= 20 * 1024 * 1024' storage.rules
          grep -Fq 'match /grupos/{grupoId}/empresas/{empresaId}/{modulo}/{registroId}/{pasta}/{arquivo}' storage.rules
          grep -Fq 'allow create, update: if contextoValido(grupoId, empresaId) && podeGravarModulo(modulo) && arquivoPermitido();' storage.rules
          grep -Fq 'allow delete: if contextoValido(grupoId, empresaId) && administrador();' storage.rules
          grep -Fq 'provider:"firebase_storage"' js/storage.js
          grep -Fq 'empresaId=empresaAtualId()' js/storage.js
          grep -Fq 'obterUrlArquivo' js/storage.js
          grep -Fq 'admin-obrigatorio' js/storage.js
          grep -Fq 'import "./js/contracts-storage.js"' app.js
          grep -Fq 'uploadArquivo({modulo:"contratos"' js/contracts-storage.js
          grep -Fq 'atualizarDocumento("contratos",contratoId,{arquivoPrincipal:meta})' js/contracts-storage.js
          grep -Fq 'não uma URL permanente de compartilhamento' js/contracts-storage.js

          # Código reduzido é metadado paralelo: manual, opcional e nunca substitui codigo/hierarquia.
          grep -Fq 'contaV6CodigoReduzido' js/ctrl-chart-accounts-v6.js
          grep -Fq 'codigoReduzido:$("contaV6CodigoReduzido")' js/ctrl-chart-accounts-v6.js
          grep -Fq '"contaPaiId","codigoReduzido"' js/ctrl-chart-accounts-v6.js
          grep -Fq 'input-v6-reduzido' js/ctrl-input-v6.js
          grep -Fq 'dre-v6-reduzido' js/ctrl-dre-v6.js
          grep -Fq 'Red. diversos' js/ctrl-dre-v6.js
          grep -Fq 'balanco-v1-reduzido' js/ctrl-balance-sheet-v1.js
          grep -Fq 'Red. diversos' js/ctrl-balance-sheet-v1.js
          grep -Fq 'planning-v2-reduzido' js/ctrl-planning-matrix-v2.js
          grep -Fq 'import "./js/account-reduced-code-ui.js"' app.js
          grep -Fq 'select option[value]' js/account-reduced-code-ui.js
          grep -Fq 'codigoReduzido' js/account-reduced-code-ui.js
