name: SIG Admin Correction Contract Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  admin-correction-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar ações administrativas V2
        shell: bash
        run: |
          set -e
          node --check js/admin-actions.js
          node --check js/master-admin-actions.js
          node --check js/input-admin-actions.js
          node --check js/workflow-admin-actions.js
          grep -Fq 'reauthenticateWithCredential' js/admin-actions.js
          grep -Fq 'auditoriaAdministrativa' js/admin-actions.js
          grep -Fq 'excluirContrato' js/master-admin-actions.js
          grep -Fq 'estornarVendedor' js/master-admin-actions.js
          grep -Fq 'estornarVenda' js/input-admin-actions.js
          grep -Fq 'estornarInputMensal' js/input-admin-actions.js
          grep -Fq 'estornarPlanoAcao' js/workflow-admin-actions.js
          grep -Fq 'estornarTarefaFechamento' js/workflow-admin-actions.js
          ! grep -Eq 'contasBancarias|fluxoCaixaFixos|centrosCusto|planoContasGerencial|budgetLinhas|forecastLinhas|premissasPlanejamento|imobilizados|planejamentoDetalhes' js/master-admin-actions.js js/input-admin-actions.js
          ! grep -Eq 'prestacaoContas|prestacaoComentarios' js/workflow-admin-actions.js
