<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Sistema de Gestão de Contratos"
  >

  <title>Gestão de Contratos</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <header class="topbar">
    <div>
      <h1>Gestão de Contratos</h1>
      <p>Controle, acompanhamento e gestão contratual</p>
    </div>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>Bem-vindo</h2>
      <p>
        Seu sistema de gestão de contratos está funcionando.
      </p>
    </section>

    <section class="cards">

      <div class="card">
        <span>Contratos ativos</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>A vencer</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>Vencidos</span>
        <strong>0</strong>
      </div>

      <div class="card">
        <span>Valor mensal</span>
        <strong>R$ 0,00</strong>
      </div>

    </section>

    <section class="actions">
      <button id="btnNovoContrato">
        + Novo contrato
      </button>
    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
