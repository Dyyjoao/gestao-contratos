<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sistema Integrado de Gestão</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <!-- TELA DE LOGIN -->
  <main id="telaLogin" class="login-page">

    <section class="login-card">

      <div class="login-logo">
        SIG
      </div>

      <h1>Sistema Integrado de Gestão</h1>

      <p>
        Acesse sua conta para continuar.
      </p>

      <button id="btnGoogle" class="btn-google">
        Entrar com Google
      </button>

      <p id="mensagemLogin" class="mensagem"></p>

    </section>

  </main>


  <!-- SISTEMA -->
  <div id="sistema" class="hidden">

    <header class="topbar">

      <div>
        <h1>Sistema Integrado de Gestão</h1>
        <p>Gestão empresarial e operacional</p>
      </div>

      <div class="usuario">

        <span id="nomeUsuario"></span>

        <button id="btnSair">
          Sair
        </button>

      </div>

    </header>


    <main class="container">

      <section class="welcome">

        <h2>Dashboard</h2>

        <p>
          Bem-vindo ao sistema.
        </p>

      </section>


      <section class="cards">

        <div class="card">
          <span>Contratos ativos</span>
          <strong>0</strong>
        </div>

        <div class="card">
          <span>A vencer</span>
          <strong>0</strong>
        </div>

        <div class="card">
          <span>Vencidos</span>
          <strong>0</strong>
        </div>

        <div class="card">
          <span>Valor mensal</span>
          <strong>R$ 0,00</strong>
        </div>

      </section>

    </main>

  </div>


  <script type="module" src="app.js"></script>

</body>
</html>
